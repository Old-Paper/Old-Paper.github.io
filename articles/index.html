<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PaperEX 的全部文章，按时间从最近到最早排列。">
  <meta name="theme-color" content="#11110f">
  <title>全部文章 · PaperEX</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('paperex-theme')||'dark'}catch(e){}</script>
</head>
<body>
  <a class="skip-link" href="#archive-list">跳到文章列表</a>
  <header class="site-header article-header archive-header">
    <a class="brand" href="../index.html" aria-label="返回 PaperEX 首页">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span>PaperEX</span>
    </a>
    <a class="archive-home-link" href="../index.html#writing">返回首页</a>
    <div class="header-actions">
      <button class="icon-button theme-toggle" type="button" aria-label="切换明暗主题" title="切换主题" data-theme-toggle>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.64 5.64l1.42 1.42m9.88 9.88 1.42 1.42m0-12.72-1.42 1.42M7.06 16.94l-1.42 1.42M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/></svg>
      </button>
    </div>
  </header>

  <main class="archive-page">
    <header class="archive-hero reveal">
      <div>
        <p class="kicker">Writing archive / 00</p>
        <h1>全部文章<span class="section-period">。</span></h1>
      </div>
      <p class="archive-summary">从最近，到最早。<br>沿着时间往回读。</p>
    </header>

    <div class="archive-list archive-empty reveal" id="archive-list" role="status">
      <span aria-hidden="true">00</span>
      <div><p>Waiting for the next story</p><h2>这里暂时还没有文章。</h2><p>下一次落笔，会从这里开始。</p></div>
    </div>
  </main>

  <script src="../app.js" defer></script>
</body>
</html>
