<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PaperEX 的 OST 专栏：按视频分类收录原创音乐与视频原声带。">
  <meta name="theme-color" content="#11110f">
  <meta property="og:title" content="OST · PaperEX">
  <meta property="og:description" content="按视频归档，为每个故事留下它的声音。">
  <meta property="og:type" content="website">
  <title>OST · PaperEX</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('paperex-theme')||'dark'}catch(e){}</script>
</head>
<body id="top">
  <a class="skip-link" href="#ost-catalog">跳到原声带分类</a>
  <header class="site-header article-header archive-header">
    <a class="brand" href="../index.html" aria-label="返回 PaperEX 首页">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span>PaperEX</span>
    </a>
    <a class="archive-home-link" href="../index.html">返回首页</a>
    <div class="header-actions">
      <button class="icon-button theme-toggle" type="button" aria-label="切换明暗主题" title="切换主题" data-theme-toggle>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.64 5.64l1.42 1.42m9.88 9.88 1.42 1.42m0-12.72-1.42 1.42M7.06 16.94l-1.42 1.42M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/></svg>
      </button>
    </div>
  </header>

  <main class="ost-page">
    <header class="ost-hero reveal">
      <div>
        <p class="kicker">Original soundtracks / 01</p>
        <h1>OST<span class="section-period">。</span></h1>
      </div>
      <p class="ost-summary">按视频归档，<br>为每个故事留下它的声音。</p>
    </header>

    <section class="ost-catalog" id="ost-catalog" aria-labelledby="ost-catalog-title">
      <header class="ost-catalog-heading reveal">
        <p class="kicker">Video collections</p>
        <h2 id="ost-catalog-title">视频原声带</h2>
        <span>01 个分类</span>
      </header>

      <article class="ost-collection reveal" id="universal-ai-girlfriend">
        <div class="ost-art" aria-hidden="true">
          <span class="ost-art-index">01</span>
          <div class="ost-record"><i></i></div>
          <div class="ost-wave">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
          <span class="ost-art-label">PAPEREX / ORIGINAL SOUNDTRACK</span>
        </div>
        <div class="ost-collection-copy">
          <div class="ost-collection-meta">
            <span>Collection 01</span>
            <span><i></i> 已建立</span>
          </div>
          <div>
            <p>Video original soundtrack</p>
            <h2>《万能人机女友》<span>视频原声带</span></h2>
            <p class="ost-collection-note">曲目将在这里按发布顺序收录。</p>
          </div>
          <div class="ost-player" data-ost-player aria-label="OST 音乐播放器">
            <audio data-ost-audio preload="metadata"></audio>
            <button type="button" data-ost-play aria-label="播放" disabled><span aria-hidden="true">▶</span></button>
            <div class="ost-player-copy">
              <span>Now playing</span>
              <strong data-ost-title>等待曲目</strong>
            </div>
            <input type="range" min="0" max="100" value="0" step="0.1" aria-label="播放进度" data-ost-progress disabled>
            <time data-ost-time>00:00 / 00:00</time>
          </div>
          <div class="ost-track-empty" role="status">
            <span>00 Tracks</span>
            <strong>曲目加入后可在本页直接播放</strong>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script src="../app.js" defer></script>
</body>
</html>
